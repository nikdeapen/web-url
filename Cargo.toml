[package]
name = "web-url"
version = "0.11.0"
description = "This library aids in processing web-based URLs."
repository = "https://github.com/nikdeapen/web-url"
edition = "2024"
rust-version = "1.87"
license = "MIT"
keywords = ["url", "web", "parse", "normalization"]
categories = ["parser-implementations", "web-programming"]
exclude = [".github/", ".idea/", ".gitignore", "ISSUES.md"]

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
copy_iterator = "warn"
module_inception = "allow"
must_use_candidate = "warn"

[dependencies]
address = "0.24.0"
